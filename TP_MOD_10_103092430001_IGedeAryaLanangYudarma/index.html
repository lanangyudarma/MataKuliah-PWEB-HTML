<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Sapa AJAX dan PHP</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex;
           justify-content: center; padding: 40px 10px; }
    .card { background: #fff; width: 100%; max-width: 420px; padding: 30px;
            border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); text-align: center; }
    h1 { font-size: 22px; color: #333; }
    label { display: block; text-align: left; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;
            box-sizing: border-box; margin-bottom: 14px; }
    button { background: #007bff; color: #fff; border: 0; padding: 8px 22px;
             border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0069d9; }
    #response { text-align: left; padding: 12px; border-radius: 6px; font-size: 13px;
                background: #f5f5f5; border: 1px solid #ddd; color: #333; }
    #response.success { background: #e8ffe8; border-color: #8fd18f; color: #1e7b1e; }
    #response.error { background: #ffe6e6; border-color: #f0a0a0; color: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Form Sapa Menggunakan AJAX dan PHP</h1>

    <label for="nama">Masukkan Nama Anda:</label>
    <input type="text" id="nama" placeholder="Contoh: Alex">

    <button id="btnKirim">Kirim</button>

    <h3>Respon Server:</h3>
    <div id="response">Menunggu input...</div>
  </div>

  <script>
    const inputNama = document.getElementById("nama");
    const respDiv = document.getElementById("response");

    document.getElementById("btnKirim").addEventListener("click", function () {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "server.php", true);
      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

      xhr.onload = function () {
        respDiv.textContent = xhr.responseText;
        respDiv.className = xhr.status === 200 ? "success" : "error";
      };
      xhr.onerror = function () {
        respDiv.textContent = "Terjadi kesalahan koneksi ke server.";
        respDiv.className = "error";
      };

      xhr.send("nama=" + encodeURIComponent(inputNama.value));
    });
  </script>
</body>
</html>
