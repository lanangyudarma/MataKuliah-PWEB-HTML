<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Baca - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-custom { background-color: #198754; } 
        .text-custom { color: #198754; }
        .btn-custom { background-color: #198754; color: white; border: none; }
        .btn-custom:hover { background-color: #146c43; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active text-white" href="#">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#">Tentang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#">Bantuan</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-3">
        <div class="row justify-content-center">
           <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                <div class="card shadow-sm border-0 p-4">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold mb-1">Masuk ke Ruang Baca</h5>
                        <p class="text-muted small mb-4">Temukan bacaan untuk hari ini.</p>

                        <form class="text-start">
                            <div class="mb-3">
                                <label class="form-label small fw-medium text-secondary">Username</label>
                                <input type="text" class="form-control" placeholder="Masukkan username">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-medium text-secondary">Password</label>
                                <input type="password" class="form-control" placeholder="Masukkan password">
                            </div>
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label small text-secondary" for="rememberMe">Ingat saya</label>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-custom py-2">Masuk</button>
                            </div>
                            <div class="text-center">
                                <a href="#" class="text-decoration-none small text-custom">Lupa password?</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
