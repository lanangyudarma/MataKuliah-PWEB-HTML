<!DOCTYPE html>
<html>
<head>
    <title>Tabel Biru dan Hijau</title>
</head>

<body>

    <h2>Tabel Biru dan Hijau</h2>

    <table
        border="1"
        bordercolor="white"
        cellspacing="0"
        cellpadding="0"
        width="275"
        height="700">

        <!-- Baris 1 -->
        <tr>

            <!-- Biru paling kiri -->
            <td
                width="55"
                rowspan="5"
                bgcolor="blue">
            </td>

            <!-- Biru bagian atas -->
            <td
                width="55"
                height="100"
                colspan="2"
                bgcolor="blue">
            </td>

            <!-- Bagian putih kanan atas -->
            <td
                width="55"
                bgcolor="white">
            </td>

        </tr>


        <!-- Baris 2 -->
        <tr>

            <!-- Hijau kiri -->
            <td
                width="55"
                height="100"
                bgcolor="lime">
            </td>

            <!-- Hijau tengah -->
            <td
                width="110"
                rowspan="2"
                bgcolor="lime">
            </td>

            <!-- Biru kanan -->
            <td
                width="55"
                rowspan="2"
                bgcolor="blue">
            </td>

        </tr>


        <!-- Baris 3 -->
        <tr>

            <!-- Putih kiri -->
            <td
                width="55"
                height="100"
                bgcolor="white">
            </td>

        </tr>


        <!-- Baris 4 -->
        <tr>

            <!-- Biru kiri bawah -->
            <td
                width="55"
                height="100"
                bgcolor="blue">
            </td>

            <!-- Putih tengah -->
            <td
                width="110"
                bgcolor="white">
            </td>

            <!-- Biru kanan bawah -->
            <td
                width="55"
                bgcolor="blue">
            </td>

        </tr>


        <!-- Baris 5 -->
        <tr>

            <!-- Bagian putih bawah -->
            <td
                colspan="3"
                height="100"
                bgcolor="white">
            </td>

        </tr>

    </table>

</body>
</html>
