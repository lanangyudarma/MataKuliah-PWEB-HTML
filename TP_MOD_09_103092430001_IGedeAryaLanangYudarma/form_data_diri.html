<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 24px;
            width: 380px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 20px;
            color: #111;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label.form-label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
            color: #222;
        }
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
            font-family: inherit;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            font-size: 13px;
            margin-bottom: 6px;
            color: #333;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #0d6efd;
        }
        button {
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
        }
        button:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Formulir Data Diri</h2>
    <form action="proses_data_diri.php" method="POST">
        <div class="form-group">
            <label for="nama" class="form-label">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>
        </div>

        <div class="form-group">
            <label for="tanggal_lahir" class="form-label">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
        </div>

        <div class="form-group">
            <label class="form-label">Hobi:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>
        </div>

        <button type="submit">Kirim</button>
    </form>
</div>

</body>
</html>
