<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Ogoh-Ogoh & Nyepi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">TRADISI BALI</div>
        <div class="nav-links">
            <a href="#home">Beranda</a>
            <a href="#collections">Galeri</a>
            <a href="#about">Tentang</a>
        </div>
    </nav>

    <section id="home">
        <h1>Sambut Tahun Baru Saka dengan <br> <span class="highlight-text">Semangat Ogoh-Ogoh</span></h1>
    </section>

    <section id="collections">
        <h2>Galeri Karya Seni</h2>
        <div class="grid-container">
            <div class="card">
                <img src="ogohogoh.webp" alt="Ogoh-ogoh 1">
                <p>Bhuta Kala</p>
            </div>
            <div class="card">
                <img src="ogohogoh.webp" alt="Ogoh-ogoh 2">
                <p>Hanoman</p>
            </div>
            <div class="card">
                <img src="ogohogoh.webp" alt="Ogoh-ogoh 3">
                <p>Celuluk</p>
            </div>
            <div class="card">
                <img src="ogohogoh.webp" alt="Ogoh-ogoh 4">
                <p>Kumbakarna</p>
            </div>
        </div>
    </section>

    <section id="about" style="padding: 50px 20px; text-align:center;">
        <h2>Tentang Nyepi</h2>
        <p>Catur Brata Penyepian adalah tradisi diam untuk merefleksikan diri.</p>

</html>
